name: Kagga Bot

on:
  schedule:
    - cron: '0 6 * * *'   # 06:00 UTC daily  → post 1
    - cron: '0 18 * * *'  # 18:00 UTC daily  → post 2
  workflow_dispatch:       # manual trigger from GitHub UI

jobs:
  post:
    runs-on: ubuntu-latest
    # Never let two runs post (and commit state) at the same time.
    concurrency:
      group: kagga-bot-post
      cancel-in-progress: false
    # Needed to push bot_state.json back to the repo.
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Post verse
        run: python kagga_bot.py --post-now
        env:
          MASTODON_ACCESS_TOKEN: ${{ secrets.MASTODON_ACCESS_TOKEN }}

      # Committing the state file does two jobs:
      #  1. the next run resumes at the following verse;
      #  2. it counts as repository activity, so GitHub does not auto-disable
      #     this scheduled workflow after 60 days without commits.
      - name: Commit posting state
        run: |
          git config user.name "kagga-bot"
          git config user.email "bot@users.noreply.github.com"
          git add bot_state.json
          if git diff --cached --quiet; then
            echo "Nothing to commit — bot_state.json unchanged."
            exit 0
          fi
          git commit -m "chore: record last posted verse"
          for attempt in 1 2 3; do
            if git push; then
              echo "Push succeeded on attempt ${attempt}."
              exit 0
            fi
            echo "Push failed (attempt ${attempt}/3); pulling with rebase..."
            git pull --rebase
          done
          echo "ERROR: all 3 push attempts failed — posting state not saved."
          exit 1
