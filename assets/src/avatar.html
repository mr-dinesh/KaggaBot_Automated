<html><head><link rel="stylesheet" href="common.css"><style>
body{width:400px;height:400px;position:relative}
.ring{position:absolute;inset:14px;border:2.5px solid var(--gold);border-radius:50%;opacity:.9}
.ring2{position:absolute;inset:22px;border:1px solid var(--gold);border-radius:50%;opacity:.35}
.wrap{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.mark{font-family:"Baloo";font-size:172px;line-height:1;margin-top:-6px;letter-spacing:-2px}
.sub{font-family:"NotoSerifKn";font-size:27px;color:var(--cream);margin-top:6px;letter-spacing:1px}
.orn{display:flex;align-items:center;gap:10px;margin-top:14px;color:var(--gold);font-family:"Cormorant";font-size:16px;letter-spacing:5px}
.orn:before,.orn:after{content:"";width:34px;height:1px;background:var(--gold);opacity:.7}
</style></head><body><div class="bg"></div><div class="ring"></div><div class="ring2"></div>
<div class="wrap"><div class="mark gold">ಕಗ್ಗ</div><div class="sub">ಮಂಕುತಿಮ್ಮ</div><div class="orn">DVG</div></div></body></html>
