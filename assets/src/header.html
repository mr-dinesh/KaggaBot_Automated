<div class="div"></div>
<div class="right"><div class="verse">ಹುಲ್ಲಾಗು ಬೆಟ್ಟದಡಿ, ಮನೆಗೆ ಮಲ್ಲಿಗೆಯಾಗು ।<br>ಕಲ್ಲಾಗು ಕಷ್ಟಗಳ ಮಳೆಯ ವಿಧಿ ಸುರಿಯೆ ॥<br>ಬೆಲ್ಲ ಸಕ್ಕರೆಯಾಗು ದೀನದುರ್ಬಲರಿಂಗೆ ।<br>ಎಲ್ಲರೊಳಗೊಂದಾಗು - ಮಂಕುತಿಮ್ಮ ॥</div>
<div class="sig">— ಕಗ್ಗ ೭೮೯</div></div></body></html>
